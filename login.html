<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | Money Rain</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="assets/css/style.css" />

    <link rel="stylesheet" href="assets/css/login.css" />
  </head>

  <body>
    <section class="login-page">
      <div class="container">
        <div class="row min-vh-100 align-items-center">
          <!-- LEFT -->

          <div class="col-lg-5 d-none d-lg-flex">
            <div class="login-info">
              <a href="index.html" class="login-logo">
                <div class="logo-circle">MR</div>

                <span>Money Rain</span>
              </a>

              <h1>Welcome Back.</h1>

              <p>
                Login to manage your investments, referrals, earnings and
                withdrawals from one secure dashboard.
              </p>

              <div class="login-features">
                <div><i class="bi bi-shield-lock-fill"></i> Secure Login</div>

                <div>
                  <i class="bi bi-graph-up-arrow"></i> Investment Dashboard
                </div>

                <div><i class="bi bi-cash-stack"></i> Withdrawal Requests</div>

                <div><i class="bi bi-people-fill"></i> Referral Earnings</div>
              </div>
            </div>
          </div>

          <!-- RIGHT -->

          <div class="col-lg-7">
            <div class="login-card">
              <div class="text-center mb-4">
                <h2>Sign In</h2>

                <p>Enter your account details below.</p>
              </div>

              <form id="loginForm">
                <div class="mb-3">
                  <label> Email Address </label>

                  <input
                    type="email"
                    id="email"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-4">
                  <label> Password </label>

                  <div class="password-box">
                    <input
                      type="password"
                      id="password"
                      class="form-control"
                      required
                    />

                    <button type="button" class="toggle-password">
                      <i class="bi bi-eye"></i>
                    </button>
                  </div>
                </div>

                <div
                  class="d-flex justify-content-between align-items-center mb-4"
                >
                  <div class="form-check">
                    <input
                      type="checkbox"
                      class="form-check-input"
                      id="remember"
                    />

                    <label class="form-check-label"> Remember Me </label>
                  </div>

                  <a href="forgot-password.html"> Forgot Password? </a>
                </div>

                <button class="btn login-btn w-100">Login</button>

                <div class="register-link">
                  Don't have an account?

                  <a href="signup.html"> Create Account </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/login.js"></script>
    <script src="assets/js/authLogin.js"></script>
  </body>
</html>
